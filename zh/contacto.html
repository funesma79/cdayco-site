<link rel="preload" href="/fonts/noto-sans-sc-chinese-simplified-400-normal.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="/base.css">
<style>
  .cwrap{padding:88px 0 110px;}
  .chead{max-width:560px;margin-bottom:56px;}
  .chead h1{font-size:clamp(2rem,4.6vw,3rem);}
  .chead p{font-family:var(--sans-zh);font-weight:400;font-size:1.15rem;color:var(--ink-soft);margin-top:16px;}

  form.contact-form{max-width:640px;display:flex;flex-direction:column;gap:26px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
  @media (max-width:560px){.form-row{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:8px;}
  .field label{font-family:var(--sans-zh);font-size:.8rem;color:var(--ink-soft);}
  .field input,.field textarea{
    font-family:var(--sans-zh);font-weight:400;font-size:1rem;padding:12px 0;background:transparent;
    border:none;border-bottom:1px solid var(--line);color:var(--ink);border-radius:0;
  }
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--ink);}
  .field textarea{resize:vertical;min-height:100px;}
  .hp-field{position:absolute;left:-9999px;}
  .consent{display:flex;align-items:flex-start;gap:9px;font-size:.86rem;color:var(--ink-soft);font-family:var(--sans-zh);}
  .consent a{text-decoration:underline;}
  .form-submit{
    align-self:flex-start;font-family:var(--sans-zh);font-size:.88rem;
    background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:15px 26px;cursor:pointer;
  }
  .form-submit:hover{background:transparent;color:var(--ink);}
  .form-status{font-family:var(--sans-zh);font-size:.86rem;min-height:1.2em;}
  .form-status[data-state="ok"]{color:#4C7A4E;}
  .form-status[data-state="err"]{color:#A3503F;}

  .direct{margin-top:64px;padding-top:36px;border-top:1px solid var(--line);display:flex;gap:56px;flex-wrap:wrap;}
  .direct div dt{font-family:var(--sans-zh);font-size:.78rem;color:var(--ink-soft);margin-bottom:6px;}
  .direct div dd{font-size:1.05rem;}
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header>
  <div class="header-inner">
    <a class="logo-link" href="/zh/"><img src="/assets/logo-cda-co-ink.png" alt="CDA & Co."></a>
    <button class="menu-toggle" id="menu-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="primary-nav">
      <span></span><span></span><span></span>
    </button>
    <nav class="primary-nav" id="primary-nav">
      <a href="/zh/">首页</a>
      <a href="/zh/servicios#fairs-events">展会与大型活动</a>
      <a href="/zh/servicios#stands-exhibition">展位与展览空间</a>
      <a href="/zh/servicios#interior-design">室内设计与建筑</a>
      <a href="/zh/estudio">工作室</a>
      <a href="/zh/contacto" class="active">联系我们</a>
      <div class="lang-switch"><a href="/contacto">ES</a><span>/</span><a href="/zh/contacto" class="active">中文</a></div>
    </nav>
  </div>
</header>

<main id="main">
  <section class="cwrap">
    <div class="wrap">
      <div class="chead">
        <div class="eyebrow gold" style="margin-bottom:20px;">联系我们</div>
        <h1>聊聊吧。</h1>
        <p>有项目想法吗?</p>
      </div>

      <form class="contact-form" id="contact-form" novalidate>
        <div class="form-row">
          <div class="field"><label for="f-nombre">姓名</label><input id="f-nombre" name="nombre" type="text" autocomplete="name" required></div>
          <div class="field"><label for="f-email">邮箱</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
        </div>
        <div class="field"><label for="f-empresa">公司</label><input id="f-empresa" name="empresa" type="text" autocomplete="organization"></div>
        <div class="field"><label for="f-mensaje">留言</label><textarea id="f-mensaje" name="mensaje" required></textarea></div>
        <div class="hp-field" aria-hidden="true"><label for="f-website">请勿填写</label><input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
        <label class="consent"><input type="checkbox" name="privacidad" required><span>我已阅读并同意<a href="/privacidad">隐私政策</a>。</span></label>
        <button class="form-submit" type="submit">发送消息</button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>

      <div class="direct">
        <dl><dt>邮箱</dt><dd><a href="mailto:hola@cdayco.com">hola@cdayco.com</a></dd></dl>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="footer-top">
      <div class="footer-brand">
        <img src="/assets/logo-cda-co-white.png" alt="CDA & Co.">
        <span>From Design to Installation</span>
      </div>
      <div class="footer-nav">
        <div class="footer-col">
          <h4>工作室</h4>
          <ul><li><a href="/zh/estudio">工作室</a></li><li><a href="/zh/servicios">服务</a></li><li><a href="/zh/proyectos">项目</a></li><li><a href="/zh/experiencia">经验</a></li></ul>
        </div>
        <div class="footer-col">
          <h4>联系</h4>
          <ul><li><a href="mailto:hola@cdayco.com">hola@cdayco.com</a></li></ul>
        </div>
        <div class="footer-col">
          <h4>法律</h4>
          <ul><li><a href="/aviso-legal">Aviso legal</a></li><li><a href="/privacidad">Privacidad</a></li><li><a href="/cookies">Cookies</a></li></ul>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© <span id="y"></span> CDA & Co. — Madrid · Spain</span>
      <span>cdayco.com</span>
    </div>
  </div>
</footer>

<script>
  document.getElementById('y').textContent = new Date().getFullYear();
  const nav = document.getElementById('primary-nav');
  const toggle = document.getElementById('menu-toggle');
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    nav.classList.remove('is-open'); toggle.setAttribute('aria-expanded','false');
  }));

  const form = document.getElementById('contact-form');
  const status = document.getElementById('form-status');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.dataset.state=''; status.textContent='';
    if (form.website.value) return;
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const payload = Object.fromEntries(new FormData(form).entries());
    const btn = form.querySelector('.form-submit'); btn.disabled = true;
    try {
      const res = await fetch('/api/contact', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error('bad-response');
      status.dataset.state='ok'; status.textContent='消息已发送,我们会尽快回复您。'; form.reset();
    } catch(err) {
      status.dataset.state='err'; status.innerHTML='发送失败,请写信至 <a href="mailto:hola@cdayco.com">hola@cdayco.com</a>。';
    } finally { btn.disabled = false; }
  });
</script>
</body>
</html>
