<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CDA & Co. — Sitio temporalmente no disponible</title>
<style>
  :root{--ink:#111;--paper:#f4f1ea;--gold:#b89a5e}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
  body{min-height:100vh;display:grid;place-items:center;padding:32px}
  main{max-width:760px;width:100%;border-top:1px solid rgba(17,17,17,.18);padding-top:34px}
  .eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
  h1{font-size:clamp(2.4rem,7vw,5.4rem);line-height:.98;margin:0 0 28px;font-weight:500;letter-spacing:-.03em}
  p{font-size:1.08rem;line-height:1.7;max-width:58ch;margin:0;color:#444}
  .brand{margin-top:44px;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:#666}
</style>
</head>
<body>
<main>
  <div class="eyebrow">CDA &amp; Co.</div>
  <h1>Estamos actualizando nuestro sitio.</h1>
  <p>La web está temporalmente no disponible mientras revisamos y actualizamos su contenido. Volverá a estar online próximamente.</p>
  <div class="brand">From Design to Installation</div>
</main>
</body>
</html>
